# apps/mobile — VGR mobile app (mirrors apps/web in setes-app)
name: vgr_mobile
description: VGR — mutual-aid reporting app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  core:
    path: ../../packages/core
  vgr_widgets:
    path: ../../packages/vgr_widgets
  vgr_validators:
    path: ../../packages/vgr_validators
  # DI and routing
  flutter_modular: ^5.0.3
  # State management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.8
  # Either<Failure, T> in repositories/usecases
  dartz: ^0.10.1
  # i18n: JSON translations, runtime switch
  easy_localization: ^3.0.7
  intl: ^0.20.2
  # Offline queue persistence + category-form catalog cache (decision 28/47);
  # declared explicitly (not only via core) so tests can mock initial values.
  shared_preferences: ^2.5.3
  # clientKey idempotency of the offline queue (decision 137)
  uuid: ^4.5.1
  # Exact position is mandatory on submit (decisions 7/135)
  geolocator: ^13.0.1
  # Evidence capture — camera/gallery (decisions 129/130)
  image_picker: ^1.1.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
