# packages/vgr_validators — shared format validators + input masks of the
# app (decisions 153–157). Each rule mirrors ONE Zod rule in vgr-api,
# named in its doc comment and proved by test (API = source of truth,
# always revalidates). No widgets, no easy_localization, no API calls:
# pure functions + a mask TextInputFormatter (flutter/services).
name: vgr_validators
description: Shared validators and masks for the vgr-app (mirrors the API)
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
