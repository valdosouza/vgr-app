# packages/vgr_widgets — design system of the vgr-app:
# NO raw Flutter widget is used directly in screens; every widget is
# encapsulated here, allowing implementations to change without impacting the system.
name: vgr_widgets
description: Design system of the vgr-app (encapsulated Vgr* widgets)
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Masks come from the validators package (decision 157): the design
  # system carries no format rule, it only hands the enum to the formatter.
  vgr_validators:
    path: ../vgr_validators

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # The identity's typeface (decisions 255, 261), bundled with the package:
  # apps refer to it as `packages/vgr_widgets/AtkinsonHyperlegibleNext`
  # through VgrTheme and never download a font at run time.
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
        - asset: fonts/AtkinsonHyperlegibleNext-ExtraBold.ttf
          weight: 800
    # Codes and secrets (2FA, audit values): same family, fixed width.
    - family: AtkinsonHyperlegibleMono
      fonts:
        - asset: fonts/AtkinsonHyperlegibleMono-Regular.ttf
          weight: 400
  assets:
    - fonts/OFL.txt
    - fonts/OFL-Mono.txt
