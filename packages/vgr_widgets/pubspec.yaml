# packages/vgr_widgets — design system of the vgr-app:
# NO raw Flutter widget is used directly in screens; every widget is
# encapsulated here, allowing implementations to change without impacting the system.
name: vgr_widgets
description: Design system of the vgr-app (encapsulated Vgr* widgets)
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
